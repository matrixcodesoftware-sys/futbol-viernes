{% macro avatar(nombre, foto_url, size=40) %}
  {% if foto_url %}
    <img class="avatar" style="width:{{ size }}px;height:{{ size }}px"
         src="{{ url_for('static', filename=foto_url) }}" alt="{{ nombre }}">
  {% else %}
    {% set iniciales = nombre.split(' ')[:2]|map('first')|join('')|upper %}
    <div class="avatar avatar-fallback" style="width:{{ size }}px;height:{{ size }}px">{{ iniciales }}</div>
  {% endif %}
{% endmacro %}

{% macro estrellas(valor, size='') %}
  <span class="estrellas {{ size }}">
    {% for i in range(1, 6) %}
      <span class="{{ 'llena' if i <= valor else 'vacia' }}">&#9733;</span>
    {% endfor %}
  </span>
{% endmacro %}
