{% extends "base.html" %}
{% block title %}Ingresar — Fútbol de los Viernes{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h1>⚽ Fútbol de los Viernes</h1>
    <p class="muted">Ingresá para anotarte al próximo partido.</p>

    <form method="post" class="form">
      <label for="email">Usuario</label>
      <input id="email" name="email" type="text" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required>

      {% if error %}<p class="alert alert-error">{{ error }}</p>{% endif %}

      <button type="submit" class="btn btn-primary">Ingresar</button>
    </form>

    <p class="muted center">¿No tenés cuenta? <a href="{{ url_for('register') }}">Registrate</a></p>
  </div>
</div>
{% endblock %}
