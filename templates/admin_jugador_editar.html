{% extends "base.html" %}
{% block title %}Admin — Editar jugador{% endblock %}
{% block content %}
{% include "_admin_nav.html" %}

<section class="card">
  <p class="eyebrow">Editar jugador</p>
  <h1>{{ jugador.name }}</h1>

  <form method="post" class="form mt-2">
    <label for="name">Nombre</label>
    <input id="name" name="name" type="text" required value="{{ jugador.name }}">

    <label for="email">Usuario</label>
    <input id="email" name="email" type="text" required value="{{ jugador.email }}">

    <label for="password">Nueva contraseña <span class="muted small">(opcional — dejala vacía para no cambiarla)</span></label>
    <input id="password" name="password" type="text" placeholder="dejar vacío para no cambiarla">

    <button type="submit" class="btn btn-primary mt-3">Guardar cambios</button>
  </form>

  <a href="{{ url_for('admin_jugadores') }}" class="btn btn-outline btn-block mt-3">Volver sin guardar</a>
</section>
{% endblock %}
